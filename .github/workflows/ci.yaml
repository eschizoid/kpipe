name: Build

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    # Compile, unit/integration tests, coverage. Runs in parallel with the jcstress job;
    # jacoco lives here (not in its own job) because jacocoTestReport consumes the .exec
    # execution data produced by the test task in the same workspace — a separate job
    # would silently re-run every test to regenerate it.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: "graalvm"
          java-version: "25"
          cache: "gradle"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Documentation consistency
        # Relative links resolve, one kpipe version across install snippets, and the README
        # quickstart matches the compiled ReadmeQuickstart.java it claims to be.
        run: ./scripts/check-docs.sh

      - name: Test with Gradle
        run: |
          ./gradlew clean
          ./gradlew spotlessApply
          ./gradlew build test --stacktrace --no-daemon --max-workers=2

      - name: Jacoco
        run: |
          # jacocoAllLibModules fans out to every :lib:* jacocoTestReport (see lib/build.gradle.kts).
          # Sourced from the project graph so new modules participate automatically.
          ./gradlew :lib:jacocoAllLibModules

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: eschizoid/kpipe
          files: ./lib/*/build/reports/jacoco/test/jacocoTestReport.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: eschizoid/kpipe
          files: |
            ./**/build/test-results/test/*.xml

  jcstress:
    # Runs the jcstress interleaving suites in every module that has one, in parallel with
    # the build job — jcstress is CPU-bound on forked JVMs and shares nothing with the test
    # step, so serializing them only added its ~30-35 minutes to the wall clock. The tasks
    # are capped (-iters 1 -time 50 -f 1, set per module) across ~21 test classes; each
    # class still exercises hundreds of thousands of real interleavings and fails the build
    # on any FORBIDDEN outcome. Deeper campaigns run on demand by raising the per-module
    # caps locally.
    #
    # timeout-minutes is a wedge guard, not a budget: ~1.5x the measured baseline plus
    # shared-runner contention margin (a noisy neighbour inflated a normal ~33-min run past
    # 45 on 2026-07-21), so a genuinely hung actor fails the job in 55 minutes instead of
    # consuming the 360-minute job default.
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: "graalvm"
          java-version: "25"
          cache: "gradle"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Concurrency stress (jcstress)
        run: |
          ./gradlew --no-daemon --stacktrace \
            :lib:kpipe-consumer:jcstress \
            :lib:kpipe-core:jcstress \
            :lib:kpipe-producer:jcstress \
            :lib:kpipe-schema-registry-confluent:jcstress

  fray:
    # Fray controlled-concurrency pilot, running alongside the jcstress job rather than
    # replacing it — jcstress stays the gate until the pilot's evidence says otherwise.
    # Fray explores schedules under its own scheduler instead of running racy code many
    # times and hoping, so this job is expected to be far shorter than the ~33-minute
    # stress baseline; the timeout is a wedge guard sized for a bounded exploration plus
    # the one-off jlink of Fray's instrumented JDK, not a budget.
    #
    # ubuntu-latest is linux-x8664, which is one of the three platforms Fray publishes its
    # native JVMTI agent for. On anything else the plugin skips the agent and the suite
    # would run un-instrumented; FrayInstrumentationSelfCheckTest fails the job in that
    # case rather than letting it read green, so pinning the runner is a performance
    # choice, not the safety mechanism.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: "graalvm"
          java-version: "25"
          cache: "gradle"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Controlled concurrency (Fray)
        # One task per module carrying Fray tests. The plugin rewires each Test task
        # independently, so a module missing from this list is not covered by any other module's
        # run — and each module carries its own FrayInstrumentationGuardTest for the same reason.
        run: |
          ./gradlew --no-daemon --stacktrace \
            :lib:kpipe-consumer:frayTest \
            :lib:kpipe-core:frayTest \
            :lib:kpipe-producer:frayTest \
            :lib:kpipe-schema-registry-confluent:frayTest

      - name: Upload Fray report
        # The report directory carries fray.log plus the recording files that replay a
        # failing schedule deterministically. Without it a red job leaves nothing to debug,
        # since the interesting schedule is not reproducible from the test output alone.
        # always(), not failure(): a job that exceeds timeout-minutes is CANCELLED rather
        # than failed, and that is precisely the run whose partial report is worth reading.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fray-report
          path: build/fray/fray-report
          if-no-files-found: ignore
