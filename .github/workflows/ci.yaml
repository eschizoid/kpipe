name: Build

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    # Compile, unit/integration tests, coverage. Runs in parallel with the jcstress job;
    # jacoco lives here (not in its own job) because jacocoTestReport consumes the .exec
    # execution data produced by the test task in the same workspace — a separate job
    # would silently re-run every test to regenerate it.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: "graalvm"
          java-version: "25"
          cache: "gradle"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Documentation consistency
        # Relative links resolve, one kpipe version across install snippets, and the README
        # quickstart matches the compiled ReadmeQuickstart.java it claims to be.
        run: ./scripts/check-docs.sh

      - name: Test with Gradle
        run: |
          ./gradlew clean
          ./gradlew spotlessApply
          ./gradlew build test --stacktrace --no-daemon --max-workers=2

      - name: Jacoco
        run: |
          # jacocoAllLibModules fans out to every :lib:* jacocoTestReport (see lib/build.gradle.kts).
          # Sourced from the project graph so new modules participate automatically.
          ./gradlew :lib:jacocoAllLibModules

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: eschizoid/kpipe
          files: ./lib/*/build/reports/jacoco/test/jacocoTestReport.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: eschizoid/kpipe
          files: |
            ./**/build/test-results/test/*.xml

  jcstress:
    # Runs the jcstress interleaving suites in every module that has one, in parallel with
    # the build job — jcstress is CPU-bound on forked JVMs and shares nothing with the test
    # step, so serializing them only added its ~30-35 minutes to the wall clock. The tasks
    # are capped (-iters 1 -time 50 -f 1, set per module) across ~21 test classes; each
    # class still exercises hundreds of thousands of real interleavings and fails the build
    # on any FORBIDDEN outcome. Deeper campaigns run on demand by raising the per-module
    # caps locally.
    #
    # timeout-minutes is a wedge guard, not a budget: ~1.5x the measured baseline plus
    # shared-runner contention margin (a noisy neighbour inflated a normal ~33-min run past
    # 45 on 2026-07-21), so a genuinely hung actor fails the job in 55 minutes instead of
    # consuming the 360-minute job default.
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: "graalvm"
          java-version: "25"
          cache: "gradle"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Concurrency stress (jcstress)
        run: |
          ./gradlew --no-daemon --stacktrace \
            :lib:kpipe-consumer:jcstress \
            :lib:kpipe-core:jcstress \
            :lib:kpipe-producer:jcstress \
            :lib:kpipe-schema-registry-confluent:jcstress
